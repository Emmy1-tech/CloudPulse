name: CloudPulse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest run for a branch. On main this avoids publishing an
# older commit after a newer push has already started its verification run.
concurrency:
  group: cloudpulse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint backend with Ruff
        working-directory: backend
        run: ruff check app tests

      - name: Verify database schema initialization
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./.ci-cloudpulse.db
        run: |
          python - <<'PY'
          from app import models
          from app.database import Base, init_db

          init_db()
          required = {"users", "endpoints", "monitoring_results", "alerts", "incidents"}
          missing = required - set(Base.metadata.tables)
          assert not missing, f"Missing model tables: {sorted(missing)}"
          print("Registered tables:", ", ".join(sorted(Base.metadata.tables)))
          PY

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit installed Python dependencies
        working-directory: backend
        run: pip-audit

  frontend-security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies (high and critical)
        working-directory: frontend
        run: npm run audit:security

  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the demo stack
        run: docker compose up --build --detach

      - name: Verify backend, frontend, and proxied API become reachable
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000/ >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000/api/endpoints/ >/dev/null; then
              echo "Backend health, frontend, and Vite-to-backend API proxy are reachable."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop demo stack
        if: always()
        run: docker compose down --volumes

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend (backend-connected mode)
        working-directory: frontend
        run: npm run build

      - name: Build frontend (public demo mode)
        working-directory: frontend
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"

  build-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - backend-tests
      - security-audit
      - frontend-security-audit
      - docker-smoke
      - frontend-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the public demo
        working-directory: frontend
        run: npm run build
        env:
          VITE_DEMO_MODE: "true"

      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: frontend/dist

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
