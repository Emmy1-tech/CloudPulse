name: CloudPulse CI

on:
  push:
    branches: [main, develop, fix/backend-ci-and-emmy-branding]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify database schema initialization
        working-directory: backend
        run: |
          python - <<'PY'
          from app import models
          from app.database import Base, init_db

          init_db()
          required = {"users", "endpoints", "monitoring_results", "alerts", "incidents"}
          missing = required - set(Base.metadata.tables)
          assert not missing, f"Missing model tables: {sorted(missing)}"
          print("Registered tables:", ", ".join(sorted(Base.metadata.tables)))
          PY

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit installed Python dependencies
        working-directory: backend
        run: pip-audit

  frontend-security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies (high and critical)
        working-directory: frontend
        run: npm run audit:security

  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the demo stack
        run: docker compose up --build --detach

      - name: Verify backend and frontend become reachable
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "Backend health endpoint and frontend are reachable."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop demo stack
        if: always()
        run: docker compose down --volumes

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend (backend-connected mode)
        working-directory: frontend
        run: npm run build

      - name: Build frontend (public demo mode)
        working-directory: frontend
        run: npm run build
        env:
          VITE_DEMO_MODE: 'true'

      - name: Verify public demo entry point and asset paths
        working-directory: frontend
        run: |
          test -s dist/index.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path("dist")

          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "script" and attrs.get("src"):
                      self.assets.append(attrs["src"])
                  if tag == "link" and attrs.get("href") and attrs.get("rel") == "stylesheet":
                      self.assets.append(attrs["href"])

          parser = AssetParser()
          parser.feed((root / "index.html").read_text(encoding="utf-8"))
          if not parser.assets:
              raise SystemExit("index.html references no JavaScript or CSS assets")
          for asset in parser.assets:
              parsed = urlparse(asset)
              if parsed.scheme or parsed.netloc:
                  continue
              relative = parsed.path.lstrip("/")
              if relative.startswith("CloudPulse/"):
                  relative = relative[len("CloudPulse/"):]
              if not (root / relative).is_file():
                  raise SystemExit(f"Missing built asset referenced by index.html: {asset}")
          print(f"Verified index.html and {len(parser.assets)} local JS/CSS asset reference(s).")
          PY
