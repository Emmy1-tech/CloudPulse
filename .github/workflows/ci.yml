name: CloudPulse CI

on:
  push:
    branches: [main, develop, fix/backend-ci-and-emmy-branding]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify database schema initialization
        working-directory: backend
        run: |
          python - <<'PY'
          from app import models
          from app.database import Base, init_db

          init_db()
          required = {"users", "endpoints", "monitoring_results", "alerts", "incidents"}
          missing = required - set(Base.metadata.tables)
          assert not missing, f"Missing model tables: {sorted(missing)}"
          print("Registered tables:", ", ".join(sorted(Base.metadata.tables)))
          PY

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -v

  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Audit installed Python dependencies
        working-directory: backend
        run: pip-audit

  frontend-security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies (high and critical)
        working-directory: frontend
        run: npm run audit:security

  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start the demo stack
        run: docker compose up --build --detach

      - name: Verify backend and frontend become reachable
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "Backend health endpoint and frontend are reachable."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop demo stack
        if: always()
        run: docker compose down --volumes

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend (backend-connected mode)
        working-directory: frontend
        run: npm run build

      - name: Build frontend (public demo mode)
        working-directory: frontend
        run: npm run build
        env:
          VITE_DEMO_MODE: 'true'
